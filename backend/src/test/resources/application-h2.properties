# Perfil "h2": base en memoria compatible con PostgreSQL, sin instalar nada.
# Pruebas: @ActiveProfiles("h2"). Ejecución local:
#   mvnw.cmd spring-boot:test-run -Dspring-boot.run.profiles=h2
spring.datasource.url=jdbc:h2:mem:tracking;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Usuarios y envíos de ejemplo para probar todas las pantallas (ver README).
app.demo-data.enabled=true
# Número de ejemplo para ver el botón de WhatsApp en local; no es un canal real.
app.contact.whatsapp=${WHATSAPP_NUMBER:573000000000}
app.contact.support-phone=${SUPPORT_PHONE:+57 300 000 0000 (de ejemplo)}
